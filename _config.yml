title: abnormalia
description: >
  Experimental mixed-media stories where systems, people, and ideas narrate themselves.
url: "https://abnormalia.com"
baseurl: ""
timezone: Europe/Rome
lang: en
author: Lab42 Srl
logo: /assets/img/android-chrome-512x512.png

safe: true

plugins:
  - jekyll-sitemap

include:
  - .well-known
markdown: kramdown
highlighter: rouge
permalink: pretty

exclude:
  - AGENTS.md
  - CLAUDE.md
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - models/
  - vaults/
  - workflows/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
