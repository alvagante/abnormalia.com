<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<meta name="author" content="{{ site.author | escape }}">
<meta name="theme-color" content="#f2efe7">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: site.logo | absolute_url }}">
<meta property="og:image:alt" content="{{ page.image_alt | default: site.title | escape }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<meta name="twitter:image" content="{{ page.image | default: site.logo | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.home or page.archive %}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">{% endif %}
{% if page.archive %}<link rel="stylesheet" href="{{ '/assets/css/archive.css' | relative_url }}">{% endif %}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/img/favicon-32x32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="icon" href="{{ '/assets/img/favicon-16x16.png' | relative_url }}" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" sizes="180x180">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | jsonify }},
  "description": {{ site.description | strip_newlines | jsonify }},
  "publisher": {
    "@type": "Organization",
    "name": {{ site.author | jsonify }},
    "url": "https://lab42.it"
  }
}
</script>
