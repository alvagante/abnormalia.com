<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body{% if page.home %} class="home"{% endif %}>
    <a class="skip-link" href="#content">Skip to content</a>
    {% if page.home %}{% include header-home.html %}{% else %}{% include header.html %}{% endif %}
    <main class="site-main" id="content">
      {{ content }}
    </main>
    {% if page.home %}{% include footer-home.html %}{% else %}{% include footer.html %}{% endif %}
    {% if page.home %}<script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
