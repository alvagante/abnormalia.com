# -- Subject -------------------------------------------------------------------
subject: "Isaac Newton"
subjectType: real
wikipediaTitle: "Isaac Newton"
sourceMode: both
facts: |
  I am born at Woolsthorpe Manor in Lincolnshire on 25 December 1642 in the
  English old style calendar, or 4 January 1643 in the Gregorian calendar. I
  study at Trinity College, Cambridge, and during the plague closure of
  1665–1666 I develop early work on calculus, optics, and gravitation.
  I become Lucasian Professor of Mathematics in 1669. With Edmond Halley's
  decisive encouragement, I publish Philosophiæ Naturalis Principia Mathematica
  in 1687, setting out the laws of motion and universal gravitation.
  I publish Opticks in 1704 after years of experiments with prisms and white
  light. I serve as Warden and then Master of the Mint, pursue counterfeiters,
  and become President of the Royal Society in 1703. I also write extensively
  on alchemy, theology, prophecy, and chronology. My priority dispute with
  Gottfried Wilhelm Leibniz over calculus becomes a defining late conflict.
details: |
  I speak only in first person singular and present tense. I never describe
  myself from outside. My voice is exacting, private, and suspicious of easy
  stories: the apple is an occasion for thought, not a blow to the head; the
  Principia is sustained labour, argument, and mathematical invention. Hold
  together my public science, my religious and alchemical studies, my service
  at the Mint, and my quarrels without turning any of them into caricature.
description: "Isaac Newton speaks in first person present tense: falling bodies, light, the Principia, hidden studies, and the cost of certainty."
slug: newton

# -- Narrative -----------------------------------------------------------------
title: "I Am the Falling World"
persona: fieldnotes
outputLength: long
iamModel: claude-opus-4-8

