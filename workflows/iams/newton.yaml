# -- Facets --------------------------------------------------------------------
facets:
  - name: Woolsthorpe and the Plague Years
    imageFilename: facet-woolsthorpe-plague.png
    cardFilename: facet-card-woolsthorpe-plague.png
    details: >-
      When Cambridge closes in 1665, I return to Woolsthorpe. Isolation gives
      me the space to work through fluxions, the colours of light, and the
      problem of why the moon does not fall to Earth. A falling apple prompts
      a question; it does not supply an answer.
    imagePrompt: >-
      Woolsthorpe Manor in rural Lincolnshire during the 1660s, a young Isaac
      Newton writing mathematical notes beneath an apple tree, a prism casting
      a spectrum across papers, the moon and an orbital curve subtly present,
      pencil-bw editorial biography illustration, transparent background.

  - name: The Principia
    imageFilename: facet-principia.png
    cardFilename: facet-card-principia.png
    details: >-
      I turn motion into a language of laws and geometry. With Halley's urging
      and support, I publish the Principia in 1687: terrestrial falling and
      celestial orbit become one problem, held by universal gravitation.
    imagePrompt: >-
      A seventeenth-century manuscript titled Principia open beside geometric
      diagrams, elliptical planetary orbits, a compass and quill, mathematical
      construction lines linking an apple-sized sphere to the moon, pencil-bw
      editorial biography illustration, transparent background.

  - name: Light in the Dark Room
    imageFilename: facet-opticks.png
    cardFilename: facet-card-opticks.png
    details: >-
      I make a narrow beam of sunlight pass through a prism and refuse the
      comforting idea that the glass creates colour. White light is already
      composite. The spectrum is not decoration; it is evidence.
    imagePrompt: >-
      A dark seventeenth-century study, a beam of sunlight through a small
      shutter hole crossing a glass prism and separating into a precise spectrum
      on a wall, notebooks and lenses on a table, pencil-bw editorial biography
      illustration with restrained spectral tonal contrast, transparent background.

  - name: The Other Kingdoms
    imageFilename: facet-other-kingdoms.png
    cardFilename: facet-card-other-kingdoms.png
    details: >-
      I read Scripture and alchemical texts with the same appetite I bring to
      geometry. At the Mint I track counterfeiters through London. In public I
      become President of the Royal Society; in private I keep searching for a
      deeper order that is not confined to the pages others choose to publish.
    imagePrompt: >-
      Isaac Newton as Master of the Mint at a desk with coins, seals, an
      alchemical manuscript, a Bible, and a Royal Society document, London in
      the background, hidden geometric symbols worked into the composition,
      pencil-bw editorial biography illustration, transparent background.

